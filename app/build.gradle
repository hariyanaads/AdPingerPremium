plugins { id 'com.android.application' }

android {
    namespace 'com.dbzbanten.adpinger'
    compileSdk 35

    defaultConfig {
        applicationId 'com.dbzbanten.adpinger'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    signingConfigs {
        release {
            def keystoreFile = System.getenv("KEYSTORE_FILE")

            if (keystoreFile != null && !keystoreFile.isEmpty()) {
                storeFile file(keystoreFile)
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEYSTORE_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
        }
    }
}

// Keep the single source of URLs at the repository root: urls.txt
// It is copied into the APK assets automatically during every build.
android.applicationVariants.all { variant ->
    def copyUrls = tasks.register("copy${variant.name.capitalize()}Urls", Copy) {
        from(rootProject.file("urls.txt"))
        into(file("src/main/assets"))
        rename { "urls.txt" }
    }
    variant.preBuildProvider.get().dependsOn(copyUrls)
}
